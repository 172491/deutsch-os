name: Assemble HP 26.10.2 archive

on:
  push:
    paths:
      - '同人创作/HP/01_原稿/26.10.2/_chunks/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble manuscript Markdown files
        shell: bash
        run: |
          set -euo pipefail
          root='同人创作/HP/01_原稿/26.10.2'
          for n in 1 2 3 4 5 6; do
            cat "$root/_chunks/v$n/"*.part > "$root/Eleanor Potter $n.md"
          done
          rm -rf "$root/_chunks"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$root"
          git commit -m 'archive: assemble HP manuscript snapshot 26.10.2'
          git push
