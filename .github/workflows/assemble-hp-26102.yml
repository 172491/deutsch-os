name: Assemble HP 26.10.2 archive

on:
  push:
    paths:
      - '同人创作/HP/01_原稿/26.10.2/_drive/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, extract and verify manuscript Markdown files
        shell: bash
        run: |
          set -euo pipefail
          root='同人创作/HP/01_原稿/26.10.2'
          curl --fail --location --retry 3 --output /tmp/hp-all.tar.xz 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-75cc-8209-b58c-beb39aede68e/raw?se=2026-10-02T16%3A44%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=f0d06dca-234d-5cb9-8c8e-8b9290360ebb&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A20%3A53Z&ske=2026-10-03T02%3A20%3A53Z&sks=b&skv=2026-02-06&sig=6Ozfzg5i/ctZTerTz8rzuH7SK3f4umVnnTYIo34yb9o%3D'
          printf '%s  %s\n' '59f8c66df3e3a07e086bb9df5224aba9b5df6bd75279b855e5a69cba05c46e29' '/tmp/hp-all.tar.xz' | sha256sum -c -
          tar -xJf /tmp/hp-all.tar.xz -C "$root"
          printf '%s  %s\n' \
            '331ba871247223368702384afc1f678852208b1d346e1d95fb13a07bb7140d09' "$root/Eleanor Potter 1.md" \
            'bc622528fccf22aa3dcb71c6e3d64b940952abbe376f5fdf850530e07ba71c4d' "$root/Eleanor Potter 2.md" \
            '57c24a918a79d27da3a5d1da54d113a5fa159f8cfe0608fef9a8b8207a07425c' "$root/Eleanor Potter 3.md" \
            'd99c46a19aa6ffa8b59dee0c8f1319c561deec2ecb72dbc9ca4b5b45c05f99c1' "$root/Eleanor Potter 4.md" \
            '7200141d40d56bcf0b6750532de2ea4ed56f1c6d9c9c5061ceae4d04a0d3b746' "$root/Eleanor Potter 5.md" \
            '7c9e36812cf3c59feaf72de82e51456a7ddf42265817a6f03f98b0d7881fd931' "$root/Eleanor Potter 6.md" \
            | sha256sum -c -
          rm -rf "$root/_drive" "$root/_payload" "$root/_payload18" "$root/_plain" "$root/_raw2" "$root/_payload2" "$root/_chunks"
          cat > "$root/README.md" <<'EOF'
          # 小说原稿归档｜26.10.2

          归档日期：**2026-10-02**。

          本目录保存截至 2026-10-02 的小说原稿快照。后续结构讨论和修改方案不得反向改写这里的归档原稿；需要修订时，应在新的工作文件或新的日期归档中进行。

          ## 已归档原稿

          - `Eleanor Potter 1.md`
          - `Eleanor Potter 2.md`
          - `Eleanor Potter 3.md`
          - `Eleanor Potter 4.md`
          - `Eleanor Potter 5.md`
          - `Eleanor Potter 6.md`

          以上文件由 2026-10-02 上传的 DOCX 原稿转换为 Markdown，并以 SHA-256 校验后归档。归档文件只保存原稿正文，不吸收后续聊天中的修改建议。
          EOF
          rm -f .github/workflows/assemble-hp-26102.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$root" .github/workflows/assemble-hp-26102.yml
          git commit -m 'archive: store HP manuscript snapshot 26.10.2'
          git push
