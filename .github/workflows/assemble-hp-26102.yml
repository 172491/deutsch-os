name: Assemble HP 26.10.2 archive

on:
  push:
    paths:
      - '同人创作/HP/01_原稿/26.10.2/_plain/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify manuscript Markdown files
        shell: bash
        run: |
          set -euo pipefail
          root='同人创作/HP/01_原稿/26.10.2'
          for n in 1 2 3 4 5 6; do
            cat "$root/_plain/v$n/"*.part > "$root/Eleanor Potter $n.md"
          done
          printf '%s  %s\n' \
            '331ba871247223368702384afc1f678852208b1d346e1d95fb13a07bb7140d09' "$root/Eleanor Potter 1.md" \
            'bc622528fccf22aa3dcb71c6e3d64b940952abbe376f5fdf850530e07ba71c4d' "$root/Eleanor Potter 2.md" \
            '57c24a918a79d27da3a5d1da54d113a5fa159f8cfe0608fef9a8b8207a07425c' "$root/Eleanor Potter 3.md" \
            'd99c46a19aa6ffa8b59dee0c8f1319c561deec2ecb72dbc9ca4b5b45c05f99c1' "$root/Eleanor Potter 4.md" \
            '7200141d40d56bcf0b6750532de2ea4ed56f1c6d9c9c5061ceae4d04a0d3b746' "$root/Eleanor Potter 5.md" \
            '7c9e36812cf3c59feaf72de82e51456a7ddf42265817a6f03f98b0d7881fd931' "$root/Eleanor Potter 6.md" \
            | sha256sum -c -
          rm -rf "$root/_plain" "$root/_payload18" "$root/_raw2" "$root/_payload" "$root/_payload2" "$root/_chunks"
          cat > "$root/README.md" <<'EOF'
          # 小说原稿归档｜26.10.2

          归档日期：**2026-10-02**。

          本目录保存截至 2026-10-02 的小说原稿快照。后续结构讨论和修改方案不得反向改写这里的归档原稿；需要修订时，应在新的工作文件或新的日期归档中进行。

          ## 已归档原稿

          - `Eleanor Potter 1.md`
          - `Eleanor Potter 2.md`
          - `Eleanor Potter 3.md`
          - `Eleanor Potter 4.md`
          - `Eleanor Potter 5.md`
          - `Eleanor Potter 6.md`

          以上文件由 2026-10-02 上传的 DOCX 原稿转换为 Markdown，并以 SHA-256 校验后归档。归档文件只保存原稿正文，不吸收后续聊天中的修改建议。
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$root"
          git commit -m 'archive: assemble HP manuscript snapshot 26.10.2'
          git push
